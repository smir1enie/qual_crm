<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Центр развития образования</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-page">
    <!-- Decorative background lines -->
    <div class="bg-decorations" aria-hidden="true">
      <div class="deco-row deco-row--top">
        <span class="deco-line"></span>
        <span class="deco-line"></span>
      </div>
      <div class="deco-row deco-row--bottom">
        <span class="deco-line"></span>
        <span class="deco-line"></span>
      </div>
    </div>

    <div class="login-card">
      <!-- Brand header -->
      <div class="brand-header">
        <div class="logo-container">
          <img src="assets/logo-green.png" alt="Логотип" class="logo-img" width="40" height="40">
        </div>
        <div class="brand-titles">
          <h1 class="brand-row-1">ЦЕНТР РАЗВИТИЯ</h1>
          <h2 class="brand-row-2">ОБРАЗОВАНИЯ</h2>
        </div>
        <div class="brand-divider"></div>
      </div>

      <!-- Credentials form -->
      <form class="credentials-form" id="loginForm">
        <div class="input-group">
          <label class="input-label" for="login">Электронная почта или логин</label>
          <div class="input-container">
            <input type="text" id="login" name="login" placeholder="example@mail.ru" autocomplete="username">
          </div>
        </div>

        <div class="password-group">
          <div class="input-group">
            <label class="input-label" for="password">Пароль</label>
            <div class="input-container input-container--password">
              <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="eye-btn" id="togglePassword" aria-label="Показать пароль">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M1 9s2.5-5 8-5 8 5 8 5-2.5 5-8 5-8-5-8-5z" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="9" cy="9" r="2.5" stroke="#999" stroke-width="1.5"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="forgot-password-row">
            <a href="#" class="forgot-link">Забыли пароль?</a>
          </div>
        </div>

        <!-- Action block -->
        <div class="action-block">
          <button type="submit" class="submit-btn">Войти</button>
        </div>
      </form>
    </div>

    <footer class="auth-footer">
      <p class="copyright">© 2025 Центр развития образования. Все права защищены.</p>
    </footer>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
